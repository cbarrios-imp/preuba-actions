name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Revisa este pull request siguiendo la guía de code review de CLAUDE.md.
            Usa `gh pr diff` para ver los cambios y lee los archivos que necesites.
            Comenta en el PR solo problemas concretos: bugs, fórmulas incorrectas,
            tests debilitados o inconsistentes con el código, código de depuración.
            Usa comentarios en línea para problemas de código y `gh pr comment`
            para un resumen breve. Si no hay problemas, dilo en un comentario corto.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
